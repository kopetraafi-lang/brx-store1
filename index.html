<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRX STORE - Digital Game & Mod Key Store</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#DC2626', // Red-600
                            dark: '#991B1B',
                            light: '#EF4444',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col select-none">

    <!-- Navigation Bar -->
    <nav class="sticky top-0 z-40 bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-bold tracking-wider text-red-500">BRX STORE</span>
            </div>
            <div>
                <button onclick="triggerQrisPayment()" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-xl font-semibold shadow-lg shadow-red-600/30 transition-all">
                    <i class="fa-solid fa-qrcode mr-2"></i> Bayar QRIS
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full text-center">
        <h1 class="text-3xl sm:text-4xl font-extrabold mb-4">Marketplace Digital Key BRX Store</h1>
        <p class="text-zinc-400 mb-8">Pilih produk digital game dan mod key terbaik dengan pembayaran instan otomatis.</p>
        
        <!-- Tombol Checkout Utama -->
        <div class="inline-block bg-zinc-900 border border-zinc-800 p-8 rounded-2xl shadow-xl max-w-md w-full">
            <h2 class="text-xl font-bold mb-2">Uji Coba Pembayaran QRIS</h2>
            <p class="text-sm text-zinc-400 mb-6">Klik tombol di bawah untuk memunculkan jendela popup QRIS Midtrans Snap secara otomatis.</p>
            <button onclick="triggerQrisPayment()" class="w-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all">
                Proses Pembayaran QRIS
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-zinc-800 py-6 text-center text-xs text-zinc-500">
        &copy; 2026 BRX Store. All rights reserved.
    </footer>

    <!-- Midtrans Snap Script dengan Client Key Anda -->
    <script src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="Mid-client-LvLfhDXvlcmUZEYc"></script>
    <script type="text/javascript">
        function triggerQrisPayment() {
            alert("Fitur QRIS aktif! Silakan masukkan Snap Token valid dari backend untuk memunculkan modal pembayaran.");
            
            /* Contoh penggunaan Snap.pay:
            window.snap.pay('MASUKKAN_SNAP_TOKEN_DARI_BACKEND', {
                onSuccess: function(result){ alert("Pembayaran Berhasil!"); console.log(result); },
                onPending: function(result){ alert("Menunggu Pembayaran QRIS."); console.log(result); },
                onError: function(result){ alert("Pembayaran Gagal!"); console.log(result); }
            });
            */
        }
    </script>
</body>
</html>
